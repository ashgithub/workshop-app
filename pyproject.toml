[project]
name = "workshop-survey"
version = "0.1.0"
description = "AI Workshop Companion"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "oracledb>=2.0.0",
    "pydantic[email]>=2.5.0",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "envyaml>=1.10.0",
    "pyyaml>=6.0.0",
    "select-ai>=1.2.0"
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
