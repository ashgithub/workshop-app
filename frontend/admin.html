<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Workshop Companion - Admin Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Chart.js removed - replaced with simple HTML/CSS charts -->
</head>
<body>
    <div class="page-shell">
        <header class="page-header">
            <div class="container">
                <h1>AI Workshop Companion</h1>
                <p class="section-subtext">Monitor onboarding progress and curate cohort experiences.</p>
            </div>
        </header>

        <main class="container">
            <div class="admin-dashboard card">
                <div class="tabs">
                    <button class="tab-btn active" data-tab="progress">Progress</button>
                    <button class="tab-btn" data-tab="game">2TL Game</button>
                    <button class="tab-btn" data-tab="queries">NL SQL</button>
                </div>

                <section id="progress-tab" class="tab-content active">
                    <div class="progress-toolbar">
                        <label class="progress-filter">
                            <span>Cohort</span>
                            <select id="progress-cohort-select">
                                <option value="">Select cohort</option>
                            </select>
                        </label>
                        <label class="progress-filter toggle">
                            <input type="checkbox" id="include-test-toggle">
                            <span>Include test attendees</span>
                        </label>
                    </div>
                    <div id="progress-content" class="progress-shell">
                        <!-- Chart tabs will be inserted here by JavaScript -->
                    </div>
                </section>

                <section id="game-tab" class="tab-content">
                    <div class="section-header">
                        <div>
                            <h2>2 Truths and a Lie Game <span id="game-progress" class="progress-indicator" style="display: none;"></span></h2>
                            <p class="section-subtext">Interactive icebreaker game for workshop attendees.</p>
                        </div>
                    </div>
                    <div class="game-controls">
                        <select id="location-select">
                            <option value="">Select Location</option>
                        </select>
                        <button class="btn-primary" id="start-game-btn" style="margin-left: 10px;">Start Game</button>
                        <button class="btn-secondary" id="reset-game-btn" style="margin-left: 10px;">Reset Game for Location</button>
                    </div>
                    <div id="game-display"></div>
                </section>

                <section id="queries-tab" class="tab-content">
                    <div class="section-header">
                        <div>
                            <h2>Natural Language SQL</h2>
                            <p class="section-subtext">Ask Oracle Select AI questions about your cohorts.</p>
                        </div>
                    </div>
                    <div class="query-panel">
                        <textarea id="query-input" rows="3" placeholder="How many attendees completed the checklist?"></textarea>
                        <div class="query-actions">
                            <button class="btn-primary" id="query-btn">Run Query</button>
                        </div>
                    </div>
                    <div id="query-results" class="query-results"></div>
                </section>
            </div>
        </main>

        <footer class="site-footer">© 2026 Oracle AI Workshop Companion</footer>
    </div>

    <script src="js/admin.js" defer></script>
</body>
</html>
