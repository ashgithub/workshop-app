# Workshop Survey Configuration
database:
  wallet: $ORACLE_WALLET
  wallet_pass: $ORACLE_WALLET_PASS
  user: $ORACLE_USER  # Will be replaced with environment variable
  password: $ORACLE_PASSWORD
  dsn: $ORACLE_DSN  # e.g., "host:port/service_name"
  select_ai_profile: workshop_app_profile

openai:
  api_key: $OPENAI_API_KEY
  base_url: $OPENAI_BASE_URL  # Optional, for OpenAI-compatible APIs

app:
  debug: $DEBUG:false  # Set to true for development
  secret_key:  $SECRET_KEY:your-secret-key-change-in-production

proxy:
  enabled: $PROXY  # Set to true when running behind nginx proxy
  prefix: "/workshop-app"  # URL prefix when behind proxy (e.g., "/workshop-app")
  bearer_token: $MINI_BEAERER  # Bearer token required for proxy authentication